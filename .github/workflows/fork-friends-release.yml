name: Fork friends release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: v0.3.1
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: .exe
            flags: -C target-feature=+crt-static
            asset: windows-x64.zip
          - os: ubuntu-22.04
            platform: linux
            exe: ""
            flags: ""
            asset: linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HORIZON_MSA_CLIENT_ID: 331e08f8-172d-43b9-835a-3108c2fcdbf3
      HORIZON_LAUNCHER_VERSION: 0.3.1
      HORIZON_LAUNCHER_TAG: ${{ inputs.tag }}
      HORIZON_TELEMETRY_URL: off
      RUSTFLAGS: ${{ matrix.flags }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source
            launcher
          shared-key: fork-friends-${{ matrix.platform }}
          cache-on-failure: true
      - name: Fetch the exact patched prebuild source and curated payload
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern prebuild-source.tar.gz
          tar xzf prebuild-source.tar.gz
          test -f source/native-hooks.json
          test -f source/tools/native-hook-fragments/render_hand_pose.json
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - name: Build the selected native game and tools
        working-directory: source
        run: cargo build --locked --profile fast -j 2 -p horizon-client -p horizon-client-lib -p horizon-prepare -p horizon-server --bin horizon-client --bin horizon-ctl --bin horizon-prepare --bin horizon-server
      - name: Build Microsoft-enabled launcher
        working-directory: launcher
        run: cargo build --locked --profile fast -j 2 --bin horizon-launcher
      - name: Package and upload platform assets
        run: |
          python tools/fork_release.py --source source --binaries source/target/fast --payload source/fork-release-payload --launcher launcher/target/fast/horizon-launcher${{ matrix.exe }} --out dist --platform ${{ matrix.platform }} --tag "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/horizon-${{ matrix.asset }} dist/horizon-launcher-${{ matrix.asset }} --repo "$GITHUB_REPOSITORY" --clobber
        env:
          RELEASE_TAG: ${{ inputs.tag }}
